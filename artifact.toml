kind = "web"
previewPath = "/"
title = "TubeBoost AI"
version = "1.0.0"
id = "artifacts/tubeboost-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23614

[services.development]
run = "pnpm --filter @workspace/tubeboost-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tubeboost-ai", "run", "build" ]
publicDir = "artifacts/tubeboost-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23614"
BASE_PATH = "/"
